<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Contratos - Chácara Amora</title>
    <style>
        /* Reset e configurações base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            color: #5a67d8;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            height: 120px;
            width: auto;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* Form Container */
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        /* Sections */
        .section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 30px;
        }

        .section h2 {
            color: #4a5568;
            font-size: 1.5rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        /* Input Groups */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fff;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #5a67d8;
            box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.1);
            transform: translateY(-1px);
        }

        .input-group input[readonly] {
            background: #f7fafc;
            cursor: not-allowed;
            color: #666;
        }

        /* Date e Value Groups */
        .date-group,
        .value-group {
            display: grid;
            gap: 20px;
        }

        .date-group {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        .value-group {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        /* Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #4a5568;
            color: white;
            box-shadow: 0 4px 15px rgba(74, 85, 104, 0.3);
        }

        .btn-secondary:hover {
            background: #2d3748;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(74, 85, 104, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-outline:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #fff;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 20px;
        }

        .close:hover {
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        /* Preview Content */
        #previewContent {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .preview-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .preview-section:last-child {
            border-bottom: none;
        }

        .preview-section h3 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .preview-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-label {
            font-weight: 600;
            color: #6c757d;
        }

        .preview-value {
            color: #495057;
        }

        /* Loading */
        .loading {
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .form-container {
                padding: 25px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .date-group,
            .value-group {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
            }
            
            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 20px;
            }
            
            .form-container {
                padding: 20px;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .section h2 {
                font-size: 1.3rem;
            }
        }

        /* Animações */
        .form-container {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estados de validação */
        .input-group.error input,
        .input-group.error select,
        .input-group.error textarea {
            border-color: #e53e3e;
            box-shadow: 0 0 0 3px rgba(229, 62, 62, 0.1);
        }

        .input-group.success input,
        .input-group.success select,
        .input-group.success textarea {
            border-color: #38a169;
            box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.1);
        }

        /* Placeholders personalizados */
        input::placeholder,
        textarea::placeholder {
            color: #a0aec0;
            opacity: 1;
        }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <svg class="logo" viewBox="0 0 400 400">
                    <rect width="400" height="400" fill="#f5f1eb"/>
                    <g transform="translate(200,80)">
                        <ellipse cx="-15" cy="0" rx="8" ry="25" fill="#2d5016" transform="rotate(-30)"/>
                        <ellipse cx="0" cy="-5" rx="8" ry="30" fill="#2d5016" transform="rotate(10)"/>
                        <ellipse cx="15" cy="0" rx="8" ry="25" fill="#2d5016" transform="rotate(30)"/>
                        <line x1="0" y1="20" x2="0" y2="40" stroke="#2d5016" stroke-width="3"/>
                    </g>
                    <text x="200" y="200" font-family="serif" font-size="58" font-weight="normal" text-anchor="middle" fill="#1a1a1a">CHÁCARA</text>
                    <text x="200" y="280" font-family="serif" font-size="72" font-weight="normal" text-anchor="middle" fill="#1a1a1a">AMORA</text>
                </svg>
            </div>
            <h1>🍓 Gerador de Contratos Amora</h1>
            <p>Preencha os dados abaixo para gerar o contrato</p>
        </header>

        <form id="contratoForm" class="form-container">
            <div class="section">
                <h2>📝 Dados do Cliente</h2>
                <div class="input-group">
                    <label for="nomeCliente">Nome Completo do Cliente</label>
                    <input type="text" id="nomeCliente" name="nomeCliente" required>
                </div>

                <div class="input-group">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular" placeholder="(11) 99999-9999" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label for="endereco">Endereço Completo</label>
                    <textarea id="endereco" name="endereco" rows="3" placeholder="Rua, número, bairro, cidade, estado, CEP" required></textarea>
                </div>
            </div>

            <div class="section">
                <h2>📅 Dados da Reserva</h2>
                <div class="date-group">
                    <div class="input-group">
                        <label for="dataInicio">Data de Início</label>
                        <input type="date" id="dataInicio" name="dataInicio" required>
                    </div>

                    <div class="input-group">
                        <label for="horaEntrada">Hora de Entrada</label>
                        <input type="time" id="horaEntrada" name="horaEntrada" value="15:00" required>
                    </div>

                    <div class="input-group">
                        <label for="dataFim">Data de Fim</label>
                        <input type="date" id="dataFim" name="dataFim" required>
                    </div>

                    <div class="input-group">
                        <label for="horaSaida">Hora de Saída</label>
                        <input type="time" id="horaSaida" name="horaSaida" value="14:00" required>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>💰 Valores e Pagamento</h2>
                <div class="value-group">
                    <div class="input-group">
                        <label for="valorTotal">Valor Total (R$)</label>
                        <input type="number" id="valorTotal" name="valorTotal" step="0.01" min="0" placeholder="0,00" required>
                    </div>

                    <div class="input-group">
                        <label for="diaEntrada">Data da Entrada</label>
                        <input type="date" id="diaEntrada" name="diaEntrada" required>
                    </div>

                    <div class="input-group">
                        <label for="valorEntrada">Valor da Entrada (R$)</label>
                        <input type="number" id="valorEntrada" name="valorEntrada" step="0.01" min="0" placeholder="0,00" required>
                    </div>

                    <div class="input-group">
                        <label for="valorRestante">Valor Restante (R$)</label>
                        <input type="number" id="valorRestante" name="valorRestante" step="0.01" min="0" placeholder="0,00" readonly>
                    </div>

                    <div class="input-group">
                        <label for="dataPagamentoRestante">Data para Pagamento do Restante</label>
                        <input type="date" id="dataPagamentoRestante" name="dataPagamentoRestante" required>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>📋 Observações Adicionais</h2>
                <div class="input-group">
                    <label for="observacoes">Observações (opcional)</label>
                    <textarea id="observacoes" name="observacoes" rows="3" placeholder="Digite aqui observações especiais sobre o contrato..."></textarea>
                </div>
            </div>

            <div class="section">
                <h2>📄 Formato de Saída</h2>
                <div class="input-group">
                    <label for="formatoSaida">Escolha o formato do contrato</label>
                    <select id="formatoSaida" name="formatoSaida" required>
                        <option value="">Selecione o formato</option>
                        <option value="pdf">📄 PDF</option>
                        <option value="word">📝 Word (DOCX)</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button type="button" id="previewBtn" class="btn btn-secondary">👁️ Visualizar Dados</button>
                <button type="submit" id="gerarContrato" class="btn btn-primary">📄 Gerar Contrato</button>
                <button type="button" id="dadosTesteBtn" class="btn btn-outline" style="background: #ffd700; color: #333; border-color: #ffd700;">🧪 Dados de Teste</button>
                <button type="reset" class="btn btn-outline">🔄 Limpar Formulário</button>
            </div>
        </form>

        <!-- Preview Modal -->
        <div id="previewModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>👁️ Prévia dos Dados</h2>
                <div id="previewContent"></div>
                <div class="modal-buttons">
                    <button type="button" id="editDataBtn" class="btn btn-secondary">✏️ Editar</button>
                    <button type="button" id="confirmGenerate" class="btn btn-primary">✅ Confirmar e Gerar</button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Gerando contrato...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos do DOM
            const form = document.getElementById('contratoForm');
            const valorTotal = document.getElementById('valorTotal');
            const valorEntrada = document.getElementById('valorEntrada');
            const valorRestante = document.getElementById('valorRestante');
            const previewBtn = document.getElementById('previewBtn');
            const previewModal = document.getElementById('previewModal');
            const previewContent = document.getElementById('previewContent');
            const closeModal = document.querySelector('.close');
            const editDataBtn = document.getElementById('editDataBtn');
            const confirmGenerate = document.getElementById('confirmGenerate');
            const loading = document.getElementById('loading');
            const dadosTesteBtn = document.getElementById('dadosTesteBtn');
            
            // Máscaras para inputs
            setupMasks();
            
            // Cálculo automático do valor restante e entrada (30%)
            function calcularValorRestante() {
                const total = parseFloat(valorTotal.value) || 0;
                const entrada = parseFloat(valorEntrada.value) || 0;
                const restante = total - entrada;
                valorRestante.value = restante >= 0 ? restante.toFixed(2) : '0.00';
            }
            
            function calcularEntrada30Porcento() {
                const total = parseFloat(valorTotal.value) || 0;
                if (total > 0) {
                    const entrada30 = total * 0.30;
                    valorEntrada.value = entrada30.toFixed(2);
                    calcularValorRestante();
                }
            }
            
            valorTotal.addEventListener('blur', function() {
                // Se o campo de entrada estiver vazio, calcular 30% automaticamente
                if (!valorEntrada.value || valorEntrada.value === '0' || valorEntrada.value === '0.00') {
                    calcularEntrada30Porcento();
                } else {
                    calcularValorRestante();
                }
            });
            valorEntrada.addEventListener('input', calcularValorRestante);
            
            // Controle de datas para melhorar UX
            const diaEntrada = document.getElementById('diaEntrada');
            const dataPagamentoRestante = document.getElementById('dataPagamentoRestante');
            
            diaEntrada.addEventListener('change', function() {
                // Quando selecionar data de entrada, definir data mínima para pagamento restante
                dataPagamentoRestante.setAttribute('min', this.value);
                if (dataPagamentoRestante.value && dataPagamentoRestante.value < this.value) {
                    dataPagamentoRestante.value = this.value;
                }
            });
            
            // Função para preencher dados de teste
            function preencherDadosTeste() {
                // Dados do cliente
                document.getElementById('nomeCliente').value = 'Maria Silva Santos';
                document.getElementById('celular').value = '(11) 99876-5432';
                document.getElementById('cpf').value = '123.456.789-00';
                document.getElementById('endereco').value = 'Rua das Flores, 123, Jardim Primavera, São Paulo - SP, CEP 01234-567';
                
                // Dados da reserva - próximo final de semana
                const hoje = new Date();
                const proximoSabado = new Date(hoje);
                proximoSabado.setDate(hoje.getDate() + (6 - hoje.getDay()));
                const proximoDomingo = new Date(proximoSabado);
                proximoDomingo.setDate(proximoSabado.getDate() + 1);
                
                document.getElementById('dataInicio').value = proximoSabado.toISOString().split('T')[0];
                document.getElementById('horaEntrada').value = '15:00';
                document.getElementById('dataFim').value = proximoDomingo.toISOString().split('T')[0];
                document.getElementById('horaSaida').value = '14:00';
                
                // Valores e pagamento
                document.getElementById('valorTotal').value = '800.00';
                
                // Data da entrada - hoje
                document.getElementById('diaEntrada').value = hoje.toISOString().split('T')[0];
                
                // Calcular 30% automaticamente
                calcularEntrada30Porcento();
                
                // Data de pagamento restante - um dia antes da entrada
                const dataPagamento = new Date(proximoSabado);
                dataPagamento.setDate(proximoSabado.getDate() - 1);
                document.getElementById('dataPagamentoRestante').value = dataPagamento.toISOString().split('T')[0];
                
                // Observações
                document.getElementById('observacoes').value = 'Cliente solicitou decoração especial para aniversário. Chegada de convidados prevista para as 16h.';
                
                // Formato de saída
                document.getElementById('formatoSaida').value = 'pdf';
                
                // Feedback visual
                alert('📝 Dados de teste preenchidos!\n\nTodos os campos foram preenchidos com dados fictícios para facilitar o teste da geração de contratos.');
            }
            
            // Configurar máscaras
            function setupMasks() {
                // Máscara para CPF
                const cpfInput = document.getElementById('cpf');
                cpfInput.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    value = value.replace(/(\d{3})(\d)/, '$1.$2');
                    value = value.replace(/(\d{3})(\d)/, '$1.$2');
                    value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    e.target.value = value;
                });
                
                // Máscara para celular
                const celularInput = document.getElementById('celular');
                celularInput.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    value = value.replace(/(\d{2})(\d)/, '($1) $2');
                    value = value.replace(/(\d{5})(\d)/, '$1-$2');
                    e.target.value = value;
                });
            }
            
            // Validação do formulário
            function validateForm() {
                const requiredFields = form.querySelectorAll('[required]');
                let isValid = true;
                
                requiredFields.forEach(field => {
                    const inputGroup = field.closest('.input-group');
                    if (!field.value.trim()) {
                        inputGroup.classList.add('error');
                        inputGroup.classList.remove('success');
                        isValid = false;
                    } else {
                        inputGroup.classList.remove('error');
                        inputGroup.classList.add('success');
                    }
                });
                
                // Validação específica para datas
                const dataInicio = document.getElementById('dataInicio').value;
                const dataFim = document.getElementById('dataFim').value;
                const diaEntradaValue = document.getElementById('diaEntrada').value;
                const dataPagamentoRestanteValue = document.getElementById('dataPagamentoRestante').value;
                
                if (dataInicio && dataFim && new Date(dataInicio) > new Date(dataFim)) {
                    alert('⚠️ A data de início não pode ser posterior à data de fim!');
                    isValid = false;
                }
                
                // Validação: data de pagamento restante deve ser antes ou igual à data de entrada na acomodação
                if (dataPagamentoRestanteValue && dataInicio && new Date(dataPagamentoRestanteValue) > new Date(dataInicio)) {
                    alert('⚠️ A data de pagamento do valor restante deve ser antes ou igual à data de entrada na acomodação!');
                    isValid = false;
                }
                
                // Validação para valores
                const total = parseFloat(valorTotal.value) || 0;
                const entrada = parseFloat(valorEntrada.value) || 0;
                
                if (entrada > total) {
                    alert('⚠️ O valor da entrada não pode ser maior que o valor total!');
                    isValid = false;
                }
                
                if (total <= 0) {
                    alert('⚠️ O valor total deve ser maior que zero!');
                    isValid = false;
                }
                
                return isValid;
            }
            
            // Preview dos dados
            function generatePreview() {
                if (!validateForm()) {
                    return;
                }
                
                const formData = new FormData(form);
                let previewHtml = '';
                
                // Dados do cliente
                previewHtml += `
                    <div class="preview-section">
                        <h3>📝 Dados do Cliente</h3>
                        <div class="preview-item">
                            <span class="preview-label">Nome:</span>
                            <span class="preview-value">${formData.get('nomeCliente')}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Celular:</span>
                            <span class="preview-value">${formData.get('celular')}</span>
                        </div>

                    const unidades = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove'];

                    dataFim.value = this.value;
                }
            });
        });
    </script>
</body>
